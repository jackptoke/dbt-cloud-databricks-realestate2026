version: 2

models:
  - name: int_listings_unioned
    description: All listings across the three channels, conformed to one shape.
    # Inherits the staging grain: one row per listing per crawl date. channel
    # belongs in the key because this is a union of three of them — a property
    # advertised in buy and later appearing in sold would collide on
    # (listing_id, crawled_on) alone if the source reuses the id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, channel, crawled_on]
    columns:
      - name: listing_id
        tests: [not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['buy', 'rent', 'sold']
      - name: property_key
        tests: [not_null]

  - name: int_listing_agents
    description: One row per listing-agent pair; empty lister entries removed.
    columns:
      - name: listing_agent_key
        tests: [unique, not_null]
      - name: agent_id
        tests: [not_null]

  - name: int_listing_features
    description: One row per listing-feature pair, name and count split apart.
    columns:
      - name: listing_feature_key
        tests: [unique, not_null]
      - name: feature_name
        tests: [not_null]

  - name: int_listing_inspections
    description: One row per inspection or auction event, deduplicated across crawls.
    # Guards the grain directly rather than leaving fct_inspection's unique test
    # to catch it: the event grain is what stops the fact fanning out.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, channel, starts_at]
    columns:
      - name: listing_id
        tests: [not_null]
      - name: starts_at
        # Warns rather than errors: rows with no start time are filtered out of
        # the model on purpose, so this can only fire if that filter is removed.
        # It exists to make the silent-drop shape visible if anyone does.
        tests:
          - not_null:
              config:
                severity: warn
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['buy', 'rent']

  - name: int_crawl_coverage
    description: >
      One row per sold crawl region: how deep it paged and whether it hit the
      source's 1,500-result ceiling. The single definition of crawl truncation,
      consumed by mart_data_coverage and both price-trend marts.

      Exists because each of those was deriving the cap from its own rows, which
      gave two marts contradictory answers for the same LGA — the ceiling
      applies to a crawl, not to whichever slice of it a region receives.
    columns:
      - name: crawl_region
        tests: [unique, not_null]
      - name: max_page
        tests: [not_null]
      - name: hit_result_cap
        description: True when this crawl exhausted the result budget, so what it did not return is missing rather than absent.
        tests: [not_null]
