version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: dim_property
    columns:
      - name: property_key
        tests: [unique, not_null]
      - name: location_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

  - name: dim_location
    columns:
      - name: location_key
        tests: [unique, not_null]

  - name: dim_agent
    columns:
      - name: agent_key
        tests: [unique, not_null]

  - name: dim_agency
    columns:
      - name: agency_key
        tests: [unique, not_null]

  - name: dim_property_type
    columns:
      - name: property_type_key
        tests: [unique, not_null]

  - name: dim_feature
    columns:
      - name: feature_key
        tests: [unique, not_null]

  - name: bridge_listing_agent
    columns:
      - name: listing_agent_key
        tests: [unique, not_null]
      - name: agent_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_agent')
                field: agent_key

  - name: bridge_listing_feature
    columns:
      - name: listing_feature_key
        tests: [unique, not_null]
      - name: feature_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_feature')
                field: feature_key

  - name: fct_listing_snapshot
    columns:
      - name: listing_snapshot_key
        tests: [unique, not_null]
      - name: property_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_key
      # dim_location builds its centroid from one row per listing, while this
      # fact keys every crawl row. If a listing's suburb/postcode ever changed
      # between crawls, the dropped row's location_key would have no dimension
      # to point at — silently, since this was the one snapshot FK untested.
      - name: location_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: crawled_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fct_sale
    description: >
      One row per completed sale. Deduplicated to the sale EVENT, not the sold
      listing — the source publishes some sales under more than one listingId.
    # The grain itself, guarded directly. sale_key's unique test only proves one
    # row per surviving listing, which was true even while one sale occupied two
    # rows. Restricted to dated sales: 14 have no sold_date and are deliberately
    # left as singletons, since an undated sale cannot be matched to anything.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_key, sold_date]
          config:
            where: "sold_date is not null"
    columns:
      - name: sale_key
        tests: [unique, not_null]
      - name: source_listing_count
        description: Source records collapsed into this sale; >1 means consolidated.
        tests: [not_null]
      - name: sold_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: agent_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_agent')
                field: agent_key

  - name: fct_rental
    columns:
      - name: rental_key
        tests: [unique, not_null]

  - name: fct_inspection
    columns:
      - name: inspection_key
        tests: [unique, not_null]
