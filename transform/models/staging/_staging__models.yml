version: 2

models:
  - name: stg_sold_properties
    description: One row per sold listing, deduplicated and typed.
    # The grain is (listing_id, crawled_on), not listing_id. A listing seen on
    # ten nights is ten legitimate rows; a listing twice on one night is the
    # pagination duplication the model exists to remove.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, crawled_on]
    columns:
      - name: listing_id
        tests: [not_null]
      - name: property_key
        tests: [not_null]
      - name: is_property_identified
        tests: [not_null]
      - name: sold_date
        description: >
          Sale date from dateSold.value. Null for a small number of listings the
          source marks Sold without supplying a date (14 of 6,828 at first load).
        tests:
          - not_null:
              config:
                warn_if: ">0"
                error_if: ">50"
                store_failures: true
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['sold']
      - name: sale_price_low_aud
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                where: "not is_price_withheld"

  - name: stg_buy_properties
    description: One row per active for-sale listing, deduplicated and typed.
    # The grain is (listing_id, crawled_on), not listing_id. A listing seen on
    # ten nights is ten legitimate rows; a listing twice on one night is the
    # pagination duplication the model exists to remove.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, crawled_on]
    columns:
      - name: listing_id
        tests: [not_null]
      - name: property_key
        tests: [not_null]
      - name: is_property_identified
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['buy']
      - name: list_price_low_aud
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
              config:
                where: "not is_price_withheld"

  - name: stg_rent_properties
    description: One row per rental listing, deduplicated and typed.
    # The grain is (listing_id, crawled_on), not listing_id. A listing seen on
    # ten nights is ten legitimate rows; a listing twice on one night is the
    # pagination duplication the model exists to remove.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [listing_id, crawled_on]
    columns:
      - name: listing_id
        tests: [not_null]
      - name: property_key
        tests: [not_null]
      - name: is_property_identified
        tests: [not_null]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['rent']
      - name: weekly_rent_aud
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
                inclusive: false
              config:
                where: "not is_price_withheld"


  - name: stg_suburbs
    description: >
      Reference geography for all of Australia: every ABS state suburb and the
      Local Government Area it belongs to, normalised from the vendored
      australian_suburbs seed. No API quota involved — this is a static file.
    columns:
      - name: ssc_code
        description: >
          ABS State Suburb Code, and the only unique key here. (suburb,
          postcode, state) is NOT unique — Green Point NSW 2251 is two distinct
          polygons — so consumers joining on name and postcode must collapse
          this model first.
        tests: [unique, not_null]
      - name: lga_key
        description: >
          Surrogate over (local_government_area, state_code). State is part of
          the key because 'Campbelltown (City)' exists in both NSW and SA, and
          'Unincorporated' spans six jurisdictions.
        tests: [not_null]
      - name: suburb_norm
        description: Lowercased, trimmed suburb name. The join key, never the display value.
        tests: [not_null]
      - name: postcode
        description: >
          Four characters, zero-padded. 313 source rows lost a leading zero
          upstream (NT 0886 stored as '886').

          not_null is the real assertion here, not a formality: normalise_postcode
          rejects anything that is not one to four digits, so a malformed value
          in a re-downloaded seed arrives as null and fails this test rather than
          being silently truncated into a valid-looking postcode. A length check
          on this column would be tautological — the macro can only ever return
          four characters or null — so the shape is asserted on the RAW seed
          column in seeds/_seeds.yml instead.
        tests:
          - not_null
      - name: state_code
        description: Uppercased. Empty source states (Jervis Bay, Norfolk Island) become 'OT', the ABS code for Other Territories.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT', 'OT']
      - name: local_government_area
        description: Upstream's misspelled `local_goverment_area`, renamed here.
        tests: [not_null]
      - name: population
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
