version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      Raw listings landed by the realestate2026_etl Declarative Pipeline.
      Pipeline-owned: dbt reads these and must never materialise into them.
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: sold_properties
        description: One row per sold listing per crawled page; heavily duplicated.
      - name: buy_properties
      - name: rent_properties
