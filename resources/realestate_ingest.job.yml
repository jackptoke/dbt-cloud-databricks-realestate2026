resources:
  jobs:
    realestate_ingest:
      name: realestate_ingest
      description: >
        Weekly: fetch listings from realty-in-au and land them as NDJSON.
        Loading bronze and building silver/gold is realestate_medallion's job,
        triggered by the files this one writes.

      # Weekly, Sunday 11pm Melbourne. Was nightly; the listing set does not
      # churn fast enough to justify a daily pass against a rate-limited key.
      # Note the sold channel below still uses max_sold_age_months=1, so a
      # 7-day cadence leaves ~3 weeks of overlap between runs — no sale can
      # fall through the gap.
      schedule:
        quartz_cron_expression: "0 0 23 ? * SUN"
        timezone_id: Australia/Melbourne

      # Three chained for_each tasks over ~20 suburbs is minutes of work, not
      # hours. Without a ceiling, one wedged HTTP call holds the cluster until
      # someone notices — and nobody is watching an 11pm job.
      timeout_seconds: 7200

      job_clusters:
        - job_cluster_key: ingest_runner
          new_cluster:
            spark_version: 16.4.x-scala2.12
            # australiaeast has been returning SkuNotAvailable for several
            # families (DS3_v2, D4ads_v6). This one is confirmed available, and
            # all three jobs use it so a stockout cannot take out one job while
            # sparing another. 4 cores covers the 3 concurrent REPLs the chained
            # for_each tasks produce.
            node_type_id: Standard_D4ds_v4
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              REALESTATE_API_KEY: "{{secrets/realestate/rapidapi_key}}"

      tasks:
        # Publishes SUBURBS as a task value so the three for_each tasks iterate
        # the same list the wheel imports — no second copy of it in this file.
        - task_key: list_suburbs
          job_cluster_key: ingest_runner
          python_wheel_task:
            package_name: realestate2026
            entry_point: list-suburbs
          libraries:
            - whl: ../dist/*.whl

        # buy and rent are STATE, not events: every run fetches the full current
        # set. There is no history to backfill and nothing to skip, which is why
        # neither carries an age filter or a marker check.
        - task_key: ingest_buy
          depends_on:
            - task_key: list_suburbs
          for_each_task:
            inputs: "{{tasks.list_suburbs.values.suburbs}}"
            # Bounds concurrent API calls, replacing the Airflow pool.
            concurrency: 3
            task:
              task_key: fetch_buy
              job_cluster_key: ingest_runner
              # In-process retries cover a throttled request; this covers the
              # iteration dying outright (REPL start-up, a cluster hiccup).
              # Replaying a suburb is safe — landing paths are deterministic
              # and a completed run prunes any pages a longer attempt left.
              max_retries: 2
              min_retry_interval_millis: 60000
              timeout_seconds: 1800
              python_wheel_task:
                package_name: realestate2026
                entry_point: fetch-suburb
                named_parameters:
                  suburb: "{{input.suburb}}"
                  state: "{{input.state}}"
                  channel: buy
                  dataset: buy_properties
                  landing_root: ${var.landing_path}
                  base_url: ${var.realestate_api_base_url}
                  # The schedule's day, not the cluster's UTC clock — an 11pm
                  # Melbourne run is already tomorrow in UTC.
                  ingest_date: "{{job.start_time.iso_date}}"
              libraries:
                - whl: ../dist/*.whl

        # Chained behind ingest_buy, not run alongside it. Three for_each
        # tasks at concurrency 3 meant up to 9 Python REPLs starting at once on
        # one 2-core node, and every iteration died with
        # "Failure starting repl. Futures timed out after [80 seconds]".
        # Chaining caps it at 3 concurrent REPLs, which is also the API rate
        # bound the concurrency was chosen for. Costs wall-clock, which is free
        # at 11pm.
        #
        # ALL_DONE, not the default ALL_SUCCESS: the dependency on ingest_buy
        # exists purely to stagger compute, so a buy failure has no bearing on
        # whether rent can be fetched. Under ALL_SUCCESS one bad suburb in buy
        # skipped rent AND sold — and sold is the only channel carrying history
        # that cannot be re-fetched tomorrow.
        #
        # Accepted trade-off: run_if is per-task, not per-dependency, so it also
        # disarms the list_suburbs dependency, which IS a hard prerequisite. If
        # list_suburbs fails, this runs anyway and fails on an unresolved task
        # value instead of skipping cleanly. Noisier run history, same outcome —
        # and ingest_buy keeps the default ALL_SUCCESS, so the first task in the
        # chain still skips properly and names the real cause.
        - task_key: ingest_rent
          run_if: ALL_DONE
          depends_on:
            - task_key: list_suburbs
            - task_key: ingest_buy
          for_each_task:
            inputs: "{{tasks.list_suburbs.values.suburbs}}"
            concurrency: 3
            task:
              task_key: fetch_rent
              job_cluster_key: ingest_runner
              max_retries: 2
              min_retry_interval_millis: 60000
              timeout_seconds: 1800
              python_wheel_task:
                package_name: realestate2026
                entry_point: fetch-suburb
                named_parameters:
                  suburb: "{{input.suburb}}"
                  state: "{{input.state}}"
                  channel: rent
                  dataset: rent_properties
                  landing_root: ${var.landing_path}
                  base_url: ${var.realestate_api_base_url}
                  ingest_date: "{{job.start_time.iso_date}}"
              libraries:
                - whl: ../dist/*.whl

        # sold is the only channel with history. max_sold_age_months=1 turns a
        # 142-page sweep into a 2-page one and keeps every suburb under the
        # API's 50-page ceiling. require_backfill_marker fails rather than
        # giving a never-backfilled suburb a month of history.
        - task_key: ingest_sold
          run_if: ALL_DONE
          depends_on:
            - task_key: list_suburbs
            - task_key: ingest_rent
          for_each_task:
            inputs: "{{tasks.list_suburbs.values.suburbs}}"
            concurrency: 3
            task:
              task_key: fetch_sold
              job_cluster_key: ingest_runner
              max_retries: 2
              min_retry_interval_millis: 60000
              timeout_seconds: 1800
              python_wheel_task:
                package_name: realestate2026
                entry_point: fetch-suburb
                named_parameters:
                  suburb: "{{input.suburb}}"
                  state: "{{input.state}}"
                  channel: sold
                  dataset: sold_properties
                  landing_root: ${var.landing_path}
                  base_url: ${var.realestate_api_base_url}
                  ingest_date: "{{job.start_time.iso_date}}"
                  max_sold_age_months: "1"
                  require_backfill_marker: "true"
              libraries:
                - whl: ../dist/*.whl

      queue:
        enabled: true

      email_notifications:
        on_failure:
          - jackptoke@gmail.com
