resources:
  jobs:
    realestate_medallion:
      name: realestate_medallion
      description: Land raw JSON to bronze, then build silver and gold with dbt.

      # Fires when the scraper drops files anywhere under the landing volume.
      # wait_after_last_change lets a multi-file crawl settle before running,
      # rather than firing once per page.
      trigger:
        file_arrival:
          url: /Volumes/realestate/landing/raw/
          wait_after_last_change_seconds: 120
          min_time_between_triggers_seconds: 300

      job_clusters:
        - job_cluster_key: dbt_runner
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: Standard_D2ds_v6
            num_workers: 0
            data_security_mode: SINGLE_USER
            # A 0-worker cluster needs these two to be a valid single node,
            # otherwise it waits forever for executors that never arrive.
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode


      tasks:
        - task_key: ingest_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.realestate2026_etl.id}

        - task_key: build_silver_gold
          depends_on:
            - task_key: ingest_bronze
          job_cluster_key: dbt_runner
          dbt_task:
            project_directory: ../transform
            source: WORKSPACE
            warehouse_id: cf2a73a5f7ab6a80
            catalog: ${var.catalog}
            schema: ${var.silver_schema}
            commands:
              - "dbt deps"
              - "dbt build"
          libraries:
            - pypi:
                package: "dbt-databricks>=1.12.3"

      queue:
        enabled: true

      email_notifications:
        on_failure:
          - jackptoke@gmail.com
