resources:
  jobs:
    realestate_backfill:
      name: realestate_backfill
      description: >
        One-off full sold history for one suburb. Run this before a newly
        watched suburb's first nightly run; the nightly job refuses to ingest
        a suburb with no backfill marker.

      # No schedule, deliberately. A full backfill is thousands of requests
      # against the same rate-limited key the nightly run depends on, so it
      # happens when someone is watching — never because a marker was missing
      # at 11pm.

      parameters:
        - name: suburb
          default: Ararat
        - name: state
          default: VIC
        # Sold reaches back ~20 years, so a full history exceeds the API's
        # 50-page ceiling in larger suburbs. Narrow with this to stay under it
        # and run the backfill in slices; leave empty for everything reachable.
        - name: write_marker
          default: "false"
        - name: max_sold_age_months
          default: "1"

      job_clusters:
        - job_cluster_key: ingest_runner
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: Standard_D2ds_v6
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              REALESTATE_API_KEY: "{{secrets/realestate/rapidapi_key}}"

      tasks:
        - task_key: backfill_sold
          job_cluster_key: ingest_runner
          python_wheel_task:
            package_name: realestate2026
            entry_point: fetch-suburb
            named_parameters:
              suburb: "{{job.parameters.suburb}}"
              state: "{{job.parameters.state}}"
              channel: sold
              dataset: sold_properties
              landing-root: ${var.landing_path}
              base-url: ${var.realestate_api_base_url}
              ingest-date: "{{job.start_time.iso_date}}"
              max-sold-age-months: "{{job.parameters.max_sold_age_months}}"
              # Written only after every page lands, so a run that dies partway
              # leaves no marker and the nightly job keeps refusing the suburb.
              write-backfill-marker: "{{job.parameters.write_marker}}"
          libraries:
            - whl: ../dist/*.whl

      email_notifications:
        on_failure:
          - jackptoke@gmail.com
