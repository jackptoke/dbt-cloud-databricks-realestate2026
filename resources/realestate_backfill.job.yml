resources:
  jobs:
    realestate_backfill:
      name: realestate_backfill
      description: >
        One-off full sold history for one suburb. Run this before a newly
        watched suburb's first nightly run; the nightly job refuses to ingest
        a suburb with no backfill marker.

      # A full backfill is long by nature, so this ceiling is generous — it is
      # here to stop a wedged run holding the cluster overnight, not to bound
      # normal work.
      timeout_seconds: 14400

      # No schedule, deliberately. A full backfill is thousands of requests
      # against the same rate-limited key the nightly run depends on, so it
      # happens when someone is watching — never because a marker was missing
      # at 11pm.

      # Job parameters are appended to a python_wheel_task automatically, as
      # --<name>=<value>. So these names must match the CLI's flags exactly,
      # and they must NOT be repeated under named_parameters below — doing both
      # passes each twice.
      parameters:
        - name: suburb
          default: Ararat
        - name: state
          default: VIC
        # Sold reaches back ~20 years, so a full history exceeds the API's
        # result ceiling in larger suburbs. Narrow with this to stay under it
        # and run the backfill in slices; empty means everything reachable,
        # which is what a backfill wants by default.
        #
        # Note the interaction with write_backfill_marker below: a sliced run
        # will NOT be certified, because one slice is not a full history. Slices
        # are for fetching the data; the marker needs a run that could actually
        # have seen everything.
        - name: max_sold_age_months
          default: ""
        # Certifies the suburb as backfilled. Defaults to false so an
        # unparameterised run cannot mark a partial fetch as complete.
        #
        # Setting it true is a request, not a guarantee: fetch_suburb declines
        # to write the marker for a run that hit the page cap or asked for a
        # slice, and logs why. Check the task log for "NOT writing a backfill
        # marker" before assuming a suburb is certified.
        - name: write_backfill_marker
          default: "false"

      job_clusters:
        - job_cluster_key: ingest_runner
          new_cluster:
            spark_version: 16.4.x-scala2.12
            node_type_id: Standard_D4ds_v4
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              REALESTATE_API_KEY: "{{secrets/realestate/rapidapi_key}}"

      tasks:
        - task_key: backfill_sold
          job_cluster_key: ingest_runner
          python_wheel_task:
            package_name: realestate2026
            entry_point: fetch-suburb
            # Only the values that are NOT job parameters. suburb, state,
            # max_sold_age_months and write_backfill_marker arrive on their own.
            named_parameters:
              channel: sold
              dataset: sold_properties
              landing_root: ${var.landing_path}
              base_url: ${var.realestate_api_base_url}
              ingest_date: "{{job.start_time.iso_date}}"
          libraries:
            - whl: ../dist/*.whl

      email_notifications:
        on_failure:
          - jackptoke@gmail.com
