# This is a Declarative Automation Bundle definition for realestate2026.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: realestate2026
  uuid: 89f8f64a-6610-4a0e-a72c-45a0ce2e3e0f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619183388188.8.azuredatabricks.net
    variables:
      catalog: realestate
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405619183388188.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/jack.toke_outlook.com#ext#@jacktokeoutlook.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jack.toke_outlook.com#ext#@jacktokeoutlook.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: realestate
      schema: prod
    permissions:
      - user_name: jack.toke_outlook.com#ext#@jacktokeoutlook.onmicrosoft.com
        level: CAN_MANAGE
