[project]
name = "realestate2026"
version = "0.0.1"
authors = [{ name = "jack.toke_outlook.com#ext#@jacktokeoutlook.onmicrosoft.com" }]
# Upper bound comes from databricks-connect (<3.13); dbt-core 1.12 also runs on
# 3.12, so a single interpreter serves both the bundle and the dbt project.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Needed by realestate2026.ingest, which runs as a python_wheel_task.
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "requests>=2.32",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
    { include-group = "dbt" },
]

# Used to run the dbt project under transform/ locally. The dbt task on the
# Databricks job installs its own copy, so these are not deployed with the wheel.
dbt = [
    "dbt-core>=1.12.0",
    "dbt-databricks>=1.12.3",
]

[project.scripts]
fetch-suburb = "realestate2026.ingest.fetch_suburb:main"
list-suburbs = "realestate2026.ingest.list_suburbs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
